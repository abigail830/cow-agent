# Platform model catalog — provider credentials stay in .env; entries reference deployments.
providers:
  azure_openai:
    base_url: ${AZURE_OPENAI_BASE_URL}
  azure_anthropic:
    base_url: ${CLAUDE_AZURE_FOUNDRY_ENDPOINT}
  siliconflow:
    base_url: ${SILICONFLOW_BASE_URL}
  dashscope:
    base_url: ${DASHSCOPE_BASE_URL}
  deepseek:
    base_url: ${DEEPSEEK_BASE_URL}

models:
  - id: gpt-5.4
    label: GPT-5.4
    provider: azure_openai
    deployment: ${AZURE_OPENAI_DEPLOYMENT}
    enabled: true

  - id: claude-sonnet-4-6
    label: Claude Sonnet 4.6
    provider: azure_anthropic
    deployment: ${CLAUDE_AZURE_FOUNDRY_MODEL}
    enabled: true

  - id: glm-5.2
    label: GLM-5.2
    provider: siliconflow
    deployment: ${SILICONFLOW_DEFAULT_MODEL}
    enabled: true

  - id: qwen3.7-plus
    label: Qwen 3.7 Plus
    provider: dashscope
    deployment: qwen3.7-plus
    enabled: true

  - id: qwen3.8-max
    label: Qwen 3.8 Max
    provider: dashscope
    deployment: qwen3.8-max
    enabled: true

  - id: deepseek-v4-flash
    label: DeepSeek V4 Flash
    provider: deepseek
    deployment: deepseek-v4-flash
    enabled: true
