# MCP servers for content-studio. Auth via backend/.env — never commit keys.
servers:
  hybrid-search:
    url: ${HYBRID_SEARCH_MCP_URL}
    auth: api_key
    integration: hybrid-search
  zhipu-web-search:
    url: ${ZHIPU_WEB_SEARCH_MCP_URL}
    headers:
      Authorization: ${ZHIPU_API_KEY}
  notion:
    url: https://mcp.notion.com/mcp
    auth: oauth
    integration: notion
