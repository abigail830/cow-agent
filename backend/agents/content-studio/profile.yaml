id: content-studio
name: "Content Studio"
description: "Knowledge Q&A (hybrid search + web) and content generation (Word, PowerPoint, HTML slides)."

model_provider: azure_anthropic
model: ${CLAUDE_AZURE_FOUNDRY_MODEL}
default_model: claude-sonnet-4-6

prompt_file: system_prompt.md
skills_dir: skills

skills:
  - kb-qa
  - docx
  - pptx
  - html-slides

mcp_servers:
  - hybrid-search
  - zhipu-web-search
  - notion
  - hubspot

allowed_tools:
  - hybrid-search_list_knowledge_bases
  - hybrid-search_hybrid_search
  - zhipu-web-search_web_search_prime
  - notion_notion-search
  - notion_notion-fetch
  - notion_notion-create-pages
  - notion_notion-update-page
  - hubspot_get_user_details
  - hubspot_search_crm_objects
  - hubspot_get_crm_objects
  - hubspot_manage_crm_objects
  - hubspot_search_properties
  - hubspot_get_properties
  - hubspot_search_owners
  - hubspot_get_tool_instructions
  - sandbox_run_command
  - sandbox_read_file
  - sandbox_write_file
  - publish_artifact

hooks:
  result_truncator:
    max_observation_bytes: 80000

memory:
  working_set_turns: 20
  cold_resume_max_turns: 12
