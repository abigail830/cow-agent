id: lrqa-assist
name: "AQRL"
description: "System migration and delivery assistant — knowledge synthesis, solution and architecture design, project docs, and content output (Word, PPT, HTML slides)."

model_provider: azure_anthropic
default_model: claude-sonnet-4-6

prompt_file: system_prompt.md
skills_dir: skills

skills:
  - kb-qa
  - plantuml-diagram
  - docx
  - pptx
  - html-slides

mcp_servers:
  - hybrid-search
  - zhipu-web-search
  - notion

allowed_tools:
  - hybrid-search_list_knowledge_bases
  - hybrid-search_hybrid_search
  - zhipu-web-search_web_search_prime
  - notion_notion-search
  - notion_notion-fetch
  - notion_notion-create-pages
  - notion_notion-update-page
  - render_plantuml
  - sandbox_run_command
  - sandbox_read_file
  - sandbox_write_file
  - publish_artifact

hooks:
  result_truncator:
    max_observation_bytes: 80000

memory:
  compaction:
    summarization:
      target_count: 20
