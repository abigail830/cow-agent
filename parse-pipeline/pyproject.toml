[project]
name = "parse-pipeline"
version = "0.1.0"
description = "Independent file parse pipeline service (async jobs, Document Mind, local text/sheet)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "openpyxl>=3.1.0",
    "alibabacloud-docmind-api20220711>=1.4.0",
    "alibabacloud-tea-openapi>=0.4.3",
    "alibabacloud-tea-util>=0.3.13",
    "markitdown[docx]>=0.1.0",
    "ftfy>=6.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
postgres = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
]

[project.scripts]
parse-pipeline = "parse_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parse_pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
